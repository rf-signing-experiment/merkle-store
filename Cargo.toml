[package]
name = "merkle-store"
version = "0.1.0"
edition = "2024"
description = "A content-addressed Merkle tree that maps file names to blobs, over pluggable storage backends."
license = "MIT OR Apache-2.0"

[dependencies]
borsh = { version = "1.6.1", features = ["derive"] }
futures = "0.3.31"
hex = "0.4.3"
sha2 = "0.11"
thiserror = "2.0.18"
tracing = "0.1"
